<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5d9fc4" />
    <meta name="description" content="Prototipo 3D para probar niveles y secuencias." />
    <title>Robot Playtest 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage" class="stage" role="img" aria-label="Mapa del robot en 3D"></div>
    <div id="hole" class="hole" aria-hidden="true"></div>

    <!-- Step-by-step toggle: turtle = slow motion. Turtle: Microsoft Fluent Emoji (MIT) -->
    <button type="button" id="speed" class="speed" aria-pressed="false" aria-label="Paso a paso">
      <img src="/turtle.png" alt="" draggable="false" />
    </button>

    <nav class="levels" aria-label="Elegir nivel">
      <button type="button" class="levels-nav levels-up" aria-label="Ver niveles anteriores">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="line" d="M6 15l6-6 6 6"/></svg>
      </button>
      <div id="levels" class="levels-track"></div>
      <button type="button" class="levels-nav levels-down" aria-label="Ver más niveles">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="line" d="M6 9l6 6 6-6"/></svg>
      </button>
    </nav>

    <section id="console" class="console" aria-label="Programa del robot">
      <div id="palette" class="palette" aria-label="Instrucciones disponibles"></div>
      <div class="bar" aria-label="Secuencia de instrucciones">
        <button type="button" id="reset" class="reset" aria-label="Borrar programa y reiniciar">
          <svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.1-5" /><path d="M4 3v5h5" /></svg>
        </button>
        <div id="program" class="program"></div>
        <button type="button" id="run" class="run" aria-label="Ejecutar instrucciones"></button>
      </div>
    </section>

    <div id="success" class="success" aria-hidden="true" inert>
      <div class="success-card">
        <canvas id="celebration" class="celebration" aria-label="El robot celebra" role="img"></canvas>
        <button type="button" id="next" class="next" aria-label="Siguiente nivel">
          <svg viewBox="0 0 24 24"><path d="M5 12h12M12 6l6 6-6 6" /></svg>
        </button>
      </div>
    </div>

    <!-- Start screen: the robot patrols its island; one big play button -->
    <div id="intro" class="intro">
      <canvas id="intro-canvas" class="intro-canvas" role="img" aria-label="El robot pasea por su isla"></canvas>
      <button type="button" id="start" class="start" aria-label="Jugar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13l10.5-6.5z"/></svg>
      </button>
    </div>

    <div id="status" class="sr-only" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
